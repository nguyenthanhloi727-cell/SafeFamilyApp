name: safe_family_app
description: "SafeFamily — ứng dụng giúp phụ huynh quản lý điện thoại của con."
publish_to: 'none'

version: 0.6.0+1

environment:
  sdk: ^3.13.4

dependencies:
  android_intent_plus: ^6.1.0
  app_blocker: ^2.2.0
  biometric_storage: 6.0.0-dev.5
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  # Có sẵn trong Flutter SDK: chữ của Material (chọn giờ, OK/Hủy…) bằng tiếng Việt.
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/BeVietnamPro/OFL.txt
    # Thông tin + ảnh cố định thành viên nhóm (xem assets/team/README.md).
    - assets/team/

  # Font đóng gói sẵn (DESIGN.md mục 2) — không tải qua mạng lúc chạy.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
          weight: 700
